
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - User Directory</title>
    <script src="users.js" defer></script>
</head>
<body>
    <header>
        <h1>USER DIRECTORY</h1>
        <p>Load and filter users.</p>
    </header>

    <main>
        <button id="load-users" type="button">Load Users</button>

        <div>
            <label for="filter-input">Filter users by name:</label>
            <input
                type="text"
                id="filter-input"
                placeholder="Enter a name..."
            >
        </div>

        <p id="status" role="status" aria-live="polite">
            Click "Load Users" to get started.
        </p>

        <ul id="users-list"></ul>
    </main>
</body>
</html>
